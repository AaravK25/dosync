<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Rhythm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep:    #0d1117;
    --bg-card:    #161c27;
    --bg-input:   #1e2535;
    --border:     #2a3348;
    --text-primary: #e8eaf0;
    --text-muted:   #7a8499;
    --gold:     #f5c542;
    --amber:    #e8914a;
    --rose:     #e06b7d;
    --indigo:   #7b8cde;
    --accent-glow: rgba(245, 197, 66, 0.15);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }



  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
  }

  header {
    text-align: center;
    margin-bottom: 2.8rem;
  }

  .eyebrow {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 2.6rem);
    font-weight: 500;
    line-height: 1.15;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-size: 0.88rem;
    color: var(--text-muted);
    font-weight: 300;
  }

  .timeline {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 28px;
    top: 28px;
    bottom: 28px;
    width: 1px;
    background: var(--border);
    opacity: 0.3;
  }

  .time-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.1rem 1.2rem;
    transition: border-color 0.3s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
  }

  .time-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.3s;
    border-radius: 16px;
  }

  .time-card.breakfast::before { background: radial-gradient(ellipse at left center, rgba(245,197,66,0.08), transparent 70%); }
  .time-card.lunch::before     { background: radial-gradient(ellipse at left center, rgba(232,145,74,0.08), transparent 70%); }
  .time-card.dinner::before    { background: radial-gradient(ellipse at left center, rgba(224,107,125,0.09), transparent 70%); }
  .time-card.bed::before       { background: radial-gradient(ellipse at left center, rgba(123,140,222,0.1), transparent 70%); }

  .time-card:focus-within {
    border-color: var(--card-color, var(--gold));
    box-shadow: 0 0 0 1px var(--card-color, var(--gold)), 0 8px 32px rgba(0,0,0,0.3);
  }

  .time-card:focus-within::before { opacity: 1; }

  .time-card.breakfast { --card-color: var(--gold); }
  .time-card.lunch     { --card-color: var(--amber); }
  .time-card.dinner    { --card-color: var(--rose); }
  .time-card.bed       { --card-color: var(--indigo); }


  .breakfast .icon-wrap { color: var(--gold); }
  .lunch     .icon-wrap { color: var(--amber); }
  .dinner    .icon-wrap { color: var(--rose); }
  .bed       .icon-wrap { color: var(--indigo); }

  .breakfast .icon-wrap { background: rgba(245,197,66,0.15); }
  .lunch     .icon-wrap { background: rgba(232,145,74,0.15); }
  .dinner    .icon-wrap { background: rgba(224,107,125,0.15); }
  .bed       .icon-wrap { background: rgba(123,140,222,0.15); }

  .card-body {
    flex: 1;
    position: relative;
    z-index: 1;
  }

  .card-label {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .breakfast .card-label { color: var(--gold); }
  .lunch     .card-label { color: var(--amber); }
  .dinner    .card-label { color: var(--rose); }
  .bed       .card-label { color: var(--indigo); }

  .card-hint {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 300;
  }

  .time-input {
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .time-input input[type="time"] {
    appearance: none;
    -webkit-appearance: none;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-size: 1.15rem;
    font-weight: 500;
    padding: 0.55rem 0.8rem;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
    min-width: 110px;
    text-align: center;
    letter-spacing: 0.04em;
  }

  .time-input input[type="time"]::-webkit-calendar-picker-indicator {
    filter: invert(0.5) sepia(1) hue-rotate(20deg) saturate(0.6);
    cursor: pointer;
    opacity: 0.6;
  }

  .time-input input[type="time"]:focus {
    outline: none;
    border-color: var(--card-color, var(--gold));
  }

  .summary {
    margin-top: 2rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem 1.4rem;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s, transform 0.4s;
    pointer-events: none;
  }

  .summary.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .summary-title {
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1rem;
    font-weight: 500;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }

  .summary-row:last-child { border-bottom: none; }

  .summary-row .s-label {
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
  }

  .summary-row .s-time {
    font-weight: 600;
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
  }


  .gap-badge {
    font-size: 0.68rem;
    color: var(--text-muted);
    background: var(--bg-input);
    border-radius: 20px;
    padding: 0.2rem 0.6rem;
    font-weight: 400;
    margin-left: 0.5rem;
  }

  .export-btn {
    display: block;
    width: 100%;
    margin-top: 1.6rem;
    padding: 0.9rem;
    border: none;
    border-radius: 12px;
    background: var(--gold);
    color: #1a1000;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }

  .export-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .export-btn:active { transform: translateY(0); }

  .export-btn:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
    transform: none;
    opacity: 1;
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1e2535;
    border: 1px solid var(--gold);
    color: var(--text-primary);
    padding: 0.75rem 1.4rem;
    border-radius: 40px;
    font-size: 0.85rem;
    font-weight: 500;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 400px) {
    body { padding: 1.4rem 0.75rem 3rem; }
    .time-input input[type="time"] { font-size: 1rem; min-width: 96px; padding: 0.5rem 0.55rem; }
    .time-card { padding: 0.9rem 0.9rem; gap: 0.75rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Daily Rhythm</h1>
  </header>

  <div class="timeline">

    <div class="time-card breakfast">
      <div class="card-body">
        <div class="card-label">Breakfast <Time></Time></div>
      </div>
      <div class="time-input">
        <input type="time" id="breakfast" aria-label="Breakfast time">
      </div>
    </div>

    <div class="time-card lunch">
      <div class="card-body">
        <div class="card-label">Lunch Time</div>
      </div>
      <div class="time-input">
        <input type="time" id="lunch" aria-label="Lunch time">
      </div>
    </div>

    <div class="time-card dinner">
      <div class="card-body">
        <div class="card-label">Dinner Time</div>
      </div>
      <div class="time-input">
        <input type="time" id="dinner" aria-label="Dinner time">
      </div>
    </div>

    <div class="time-card bed">
      <div class="card-body">
        <div class="card-label">Bedtime</div>
      </div>
      <div class="time-input">
        <input type="time" id="bed" aria-label="Bed time">
      </div>
    </div>

  </div>

  <div class="summary" id="summary">
    <div class="summary-title">Your schedule</div>

    <div class="summary-row">
      <span class="s-label"><span class="s-dot breakfast"></span>Breakfast</span>
      <span><span class="s-time breakfast" id="s-breakfast">—</span></span>
    </div>
    <div class="summary-row">
      <span class="s-label"><span class="s-dot lunch"></span>Lunch <span class="gap-badge" id="gap-lunch"></span></span>
      <span><span class="s-time lunch" id="s-lunch">—</span></span>
    </div>
    <div class="summary-row">
      <span class="s-label"><span class="s-dot dinner"></span>Dinner <span class="gap-badge" id="gap-dinner"></span></span>
      <span><span class="s-time dinner" id="s-dinner">—</span></span>
    </div>
    <div class="summary-row">
      <span class="s-label"><span class="s-dot bed"></span>Bedtime <span class="gap-badge" id="gap-bed"></span></span>
      <span><span class="s-time bed" id="s-bed">—</span></span>
    </div>

    <button class="export-btn" id="exportBtn" onclick="startDosync()" disabled>Start Dosync</button>
  </div>
</div>

<div class="toast" id="toast">Schedule saved!</div>

<script>
  const fields = ['breakfast','lunch','dinner','bed'];

  function toMinutes(val) {
    if (!val) return null;
    const [h, m] = val.split(':').map(Number);
    return h * 60 + m;
  }

  function gapText(a, b) {
    if (a === null || b === null) return '';
    let diff = b - a;
    if (diff < 0) diff += 1440;
    const h = Math.floor(diff / 60);
    const m = diff % 60;
    if (h === 0) return `${m}m gap`;
    if (m === 0) return `${h}h gap`;
    return `${h}h ${m}m gap`;
  }

  function update() {
    const vals = {};
    fields.forEach(f => { vals[f] = document.getElementById(f).value || null; });

    const mins = {};
    fields.forEach(f => { mins[f] = toMinutes(vals[f]); });

    // Summary display
    fields.forEach(f => {
      const el = document.getElementById('s-' + f);
      el.textContent = vals[f] ? vals[f] : '—';
    });

    // Gap badges
    document.getElementById('gap-lunch').textContent  = gapText(mins.breakfast, mins.lunch);
    document.getElementById('gap-dinner').textContent = gapText(mins.lunch,     mins.dinner);
    document.getElementById('gap-bed').textContent    = gapText(mins.dinner,    mins.bed);

    // Show summary if any field filled
    const any = fields.some(f => vals[f]);
    document.getElementById('summary').classList.toggle('visible', any);

    // Enable the button only when all filled — unless Dosync is already
    // active, in which case we leave its state to pollPipelineStatus().
    const all = fields.every(f => vals[f]);
    if (!dosyncActive) {
      document.getElementById('exportBtn').disabled = !all;
    }
  }

  fields.forEach(f => {
    document.getElementById(f).addEventListener('change', update);
    document.getElementById(f).addEventListener('input', update);
  });

  // Load from localStorage
  window.addEventListener('DOMContentLoaded', () => {
    try {
      const saved = JSON.parse(localStorage.getItem('dailyRhythm') || '{}');
      fields.forEach(f => {
        if (saved[f]) document.getElementById(f).value = saved[f];
      });
      update();
    } catch(e) {}
  });

  let dosyncActive = false;
  let pollTimer = null;

  function resetExportBtn() {
    dosyncActive = false;
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    const btn = document.getElementById('exportBtn');
    const all = fields.every(f => document.getElementById(f).value);
    btn.disabled = !all;
    btn.textContent = 'Start Dosync';
  }

  async function startDosync() {
    const data = {};
    fields.forEach(f => { data[f] = document.getElementById(f).value; });

    // Save locally first
    localStorage.setItem('dailyRhythm', JSON.stringify(data));

    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    dosyncActive = true;
    const btn = document.getElementById('exportBtn');
    btn.disabled = true;
    btn.textContent = 'Starting…';

    try {
      const res = await fetch('http://127.0.0.1:5500/schedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const json = await res.json();
      if (res.ok && json.ok) {
        showToast(json.message || '✓ Dosync started');
        pollPipelineStatus(0);
      } else {
        showToast('✗ Server error: ' + (json.error || res.status));
        resetExportBtn();
      }
    } catch (err) {
      showToast('✗ Could not reach server (is it running?)');
      console.error('startDosync error:', err);
      resetExportBtn();
    }
  }

  async function pollPipelineStatus(attempt) {
    const MAX_ATTEMPTS = 300; // ~12.5 min at 2.5s interval
    const btn = document.getElementById('exportBtn');

    try {
      const res = await fetch('http://127.0.0.1:5500/pipeline-status');
      const json = await res.json();

      if (res.ok && json.ok) {
        const status = json.pipeline.status;

        if (status === 'running_inference') {
          btn.textContent = 'Reading prescription…';
        } else if (status === 'monitoring') {
          btn.textContent = '✓ Dosync is live';
          showToast('✓ Dosync is live — monitoring doses');
          return; // reached a stable end state, stop polling
        } else if (status === 'error') {
          showToast('✗ Dosync error: ' + (json.pipeline.error || 'unknown error'));
          resetExportBtn();
          return;
        } else if (status === 'idle') {
          // Reminder daemon exited cleanly on its own — nothing left to track.
          resetExportBtn();
          return;
        }
      }
    } catch (err) {
      console.error('pipeline-status poll failed:', err);
      // Keep trying — the server may be momentarily busy.
    }

    if (attempt < MAX_ATTEMPTS) {
      pollTimer = setTimeout(() => pollPipelineStatus(attempt + 1), 2500);
    } else {
      showToast('Still running — check the server window for progress.');
      resetExportBtn();
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
